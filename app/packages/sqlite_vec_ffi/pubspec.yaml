name: sqlite_vec_ffi
description: Compiles the vendored sqlite-vec sources and registers them as a SQLite auto-extension.
publish_to: none

environment:
  sdk: ^3.11.1

# `hooks`, `code_assets` and `native_toolchain_c` sit under `dependencies`,
# not `dev_dependencies`, and that is not an oversight: hook/build.dart runs
# out of THIS package's own dependency graph when the app is built, and a
# package's dev dependencies are not resolved for its consumers. The sqlite3
# package declares the same three the same way.
dependencies:
  sqlite3: ^3.5.2
  hooks: '>=1.0.0 <3.0.0'
  code_assets: '>=1.0.0 <3.0.0'
  native_toolchain_c: '>=0.17.5 <0.20.0'
