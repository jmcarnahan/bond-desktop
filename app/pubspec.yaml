name: bond_inbox
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Pinned exactly, and it has to be. `drift_dev` is held at 2.34.0 by the
  # analyzer version this Flutter SDK ships, and drift_dev 2.34.0 does not
  # compile against drift 2.34.1+ — `drift_dev make-migrations` fails on
  # drift's moved `GeneratedDatabase` API. The two move together or not at
  # all; raise both when the SDK's analyzer allows it.
  drift: 2.34.0
  # Still a direct dependency after the drift port: `adoptLegacyDatabase` has
  # to read `user_version` off a pre-drift file before drift is allowed to
  # open it and decide the schema is missing.
  sqlite3: ^3.5.2
  # In-tree, because it is a build hook as much as a library: it compiles the
  # committed sqlite-vec C sources into a bundled dylib and registers them as
  # a SQLite auto-extension. See packages/sqlite_vec_ffi/ and `make vec-vendor`.
  sqlite_vec_ffi:
    path: packages/sqlite_vec_ffi
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.0.0
  crypto: ^3.0.3
  # Pinned exactly, not a caret range: this package is young and the wire
  # dialect it speaks (legacy vs. stable MCP handshake) has moved between
  # minor versions. bond_mcp_client.dart is the only file allowed to import
  # it, so a bump is a one-file review.
  mcp_dart: 2.4.1
  # Caret rather than the exact pins drift and mcp_dart carry: this package is
  # a mature Flutter Favorite whose API has been stable across patch releases,
  # and only local_desktop_notifier.dart is allowed to import it, so a bump is
  # a one-file review.
  flutter_local_notifications: ^22.3.0
  package_info_plus: ^10.2.1
  # Pinned exactly. pdfium rides along as an XCFramework on macOS, so a bump
  # changes what the Runner links; 2.6 is why the toolchain floor is Flutter
  # 3.47 and macOS 12, and why `intl` is ^0.20 (pdfrx 2.5+ requires it).
  # `lib/widgets/preview/pdf_preview.dart` is the only file allowed to import
  # it — everything else talks to the `PdfRenderer` interface beside it, which
  # is also what keeps pdfium out of `flutter test`.
  pdfrx: 2.6.1
  # Pinned exactly: the save dialog is a platform channel, and
  # `lib/services/attachments/file_dialogs.dart` is the only file allowed to
  # import it — everything above takes the `FileDialogs` interface.
  file_selector: 1.1.0
  # Pinned exactly, the pair behind the XLSX preview. The `excel` package was
  # the plan, and it cannot be used: its newest release (4.0.6, Aug 2024)
  # requires archive ^3 and xml <7 while pdfrx 2.6 requires archive ^4, and
  # pdfrx is the one that decides the toolchain. A workbook is a zip of XML,
  # so `lib/services/attachments/xlsx_reader.dart` reads the few parts a
  # preview needs with these two, and is the only file allowed to import them.
  archive: 4.2.0
  xml: 7.0.1
  # Both were already resolved transitively; promoted to direct because the
  # context-directories walk and the Claude-conventions parser import them by
  # name. `glob` matches `.bondignore` / `.gitignore` patterns against a rel
  # path, `yaml` reads the frontmatter of a skill or a rule. Carets rather
  # than pins: neither is near the toolchain, and both are stable.
  glob: ^2.1.2
  yaml: ^3.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The model manifest: which GGUF files the app downloads, from where, and
  # what they must hash to. Bumping a model is an edit to this file
  # (docs/distribution.md, "Bumping a model").
  assets:
    - assets/models/manifest.json

  # Family names must stay exactly these three — BondType references them
  # by string (lib/theme/bond_typography.dart).
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
